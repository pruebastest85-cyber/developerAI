services:
  searxng:
    image: searxng/searxng:latest
    container_name: developerai-searxng
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=developerai-local-secret
      - SEARXNG_BIND_ADDRESS=0.0.0.0
      - SEARXNG_PORT=8080
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped
